<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Order List</title></head>
<body>
    <h1>Order Management</h1>
    <a th:href="@{/orders/new}">Create New Order</a><br/><br/>
    <table border="1" cellpadding="6">
        <tr>
            <th>ID</th>
            <th>Customer ID</th>
            <th>Table ID</th>
            <th>Status</th>
            <th>Items Count</th>
            <th>Actions</th>
        </tr>
        <tr th:each="item : ${orders}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.customerId}"></td>
            <td th:text="${item.tableId}"></td>
            <td th:text="${item.status}"></td>
            <td th:text="${#lists.size(item.orderLines)}"></td>
            <td>
                <a th:href="@{/orders/{id}(id=${item.id})}">Details</a> |
                <a th:href="@{/orders/{id}/edit(id=${item.id})}">Edit</a> |
                <form th:action="@{/orders/{id}/delete(id=${item.id})}" method="post" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </table>
    <br/><a th:href="@{/}">Back to Home</a>
</body>
</html>
