<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>New Order</title></head>
<body>
    <h1>Create New Order</h1>
    <form th:action="@{/orders}" method="post">
        <label>Customer:</label>
        <select name="customerId" required>
            <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name + ' (' + c.id + ')'}"></option>
        </select><br/><br/>

        <label>Table:</label>
        <select name="tableId" required>
            <option th:each="t : ${tables}" th:value="${t.id}" th:text="${'Table ' + t.number + ' (' + t.occupiedStatus + ')'}"></option>
        </select><br/><br/>

        <button type="submit">Create Order</button>
    </form>
    <br/><a th:href="@{/orders}">Cancel</a>
</body>
</html>
