<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Details</title>
</head>
<body>
    <h1>Customer Details</h1>
    <p><strong>ID:</strong> <span th:text="${customer.id}"></span></p>
    <p><strong>Name:</strong> <span th:text="${customer.name}"></span></p>
    <p><strong>Phone Number:</strong> <span th:text="${customer.phoneNumber}"></span></p>
    <p><strong>Order IDs:</strong> <span th:text="${customer.orders}"></span></p>
    <br/>
    <a th:href="@{/customers/{id}/edit(id=${customer.id})}">Edit</a> |
    <a th:href="@{/customers}">Back to List</a>
</body>
</html>
