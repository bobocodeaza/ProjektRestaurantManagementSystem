<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Customer</title>
</head>
<body>
    <h1>Edit Customer</h1>
    <form th:action="@{/customers/{id}(id=${customer.id})}" method="post" th:object="${customer}">
        <input type="hidden" th:field="*{id}"/>
        <label>Name:</label><input type="text"  th:field="*{name}" required/><br/><br/>
        <label>Phone Number:</label><input type="text"  th:field="*{phoneNumber}" required/><br/><br/>
        <button type="submit">Update</button>
    </form>
    <br/><a th:href="@{/customers}">Cancel</a>
</body>
</html>
