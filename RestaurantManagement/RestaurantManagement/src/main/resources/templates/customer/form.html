<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>New Customer</title></head>
<body>
    <h1>Create Customer</h1>
    <form th:action="@{/customers}" method="post" th:object="${customer}">
        <label>Name:</label><input type="text" th:field="*{name}" required/><br/><br/><label>Phone:</label><input type="text" th:field="*{phoneNumber}" required/><br/><br/>
        <button type="submit">Save</button>
    </form>
    <br/><a th:href="@{/customers}">Cancel</a>
</body>
</html>
