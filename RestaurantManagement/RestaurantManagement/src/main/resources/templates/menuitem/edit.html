<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Menu Item</title>
</head>
<body>
    <h1>Edit Menu Item</h1>
    <form th:action="@{/menuitems/{id}(id=${item.id})}" method="post" th:object="${item}">
        <input type="hidden" th:field="*{id}"/>
        <label>Name:</label><input type="text"  th:field="*{name}" required/><br/><br/>
        <label>Price:</label><input type="number" step="0.01" th:field="*{price}" required/><br/><br/>
        <label>Category:</label><input type="text"  th:field="*{category}" required/><br/><br/>
        <button type="submit">Update</button>
    </form>
    <br/><a th:href="@{/menuitems}">Cancel</a>
</body>
</html>
