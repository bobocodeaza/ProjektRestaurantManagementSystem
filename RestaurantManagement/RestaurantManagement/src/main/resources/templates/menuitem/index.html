<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>MenuItem List</title></head>
<body>
    <h1>MenuItem Management</h1>
    <a th:href="@{/menuitems/new}">Create New MenuItem</a><br/><br/>
    <table border="1">
        <tr><th>ID</th><th>Name</th><th>Price</th><th>Category</th><th>Actions</th></tr>
        <tr th:each="item : ${items}">
            <td th:text="${item.id}"></td><td th:text="${item.name}"></td><td th:text="${item.price}"></td><td th:text="${item.category}"></td>
            <td>
                <form th:action="@{/menuitems/{id}/delete(id=${item.id})}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </table>
    <br/><a href="/">Back to Home</a>
</body>
</html>
