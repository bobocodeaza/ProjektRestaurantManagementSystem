<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Order Assignment List</title></head>
<body>
    <h1>Order Assignment Management</h1>
    <a th:href="@{/assignments/new}">Create New Assignment</a><br/><br/>
    <table border="1" cellpadding="6">
        <tr>
            <th>ID</th>
            <th>Order ID</th>
            <th>Staff ID</th>
            <th>Actions</th>
        </tr>
        <tr th:each="item : ${assignments}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.orderId}"></td>
            <td th:text="${item.staffId}"></td>
            <td>
                <a th:href="@{/assignments/{id}(id=${item.id})}">Details</a> |
                <a th:href="@{/assignments/{id}/edit(id=${item.id})}">Edit</a> |
                <form th:action="@{/assignments/{id}/delete(id=${item.id})}" method="post" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </table>
    <br/><a th:href="@{/}">Back to Home</a>
</body>
</html>
