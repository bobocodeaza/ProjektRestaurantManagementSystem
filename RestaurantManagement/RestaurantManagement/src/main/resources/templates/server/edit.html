<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Server</title>
</head>
<body>
    <h1>Edit Server</h1>
    <form th:action="@{/servers/{id}(id=${server.id})}" method="post" th:object="${server}">
        <input type="hidden" th:field="*{id}"/>
        <label>Name:</label><input type="text"  th:field="*{name}" required/><br/><br/>
        <label>Designation:</label><input type="text"  th:field="*{designation}" required/><br/><br/>
        <button type="submit">Update</button>
    </form>
    <br/><a th:href="@{/servers}">Cancel</a>
</body>
</html>
