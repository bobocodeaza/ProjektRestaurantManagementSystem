<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Server List</title></head>
<body>
    <h1>Server Management</h1>
    <a th:href="@{/servers/new}">Create New Server</a><br/><br/>
    <table border="1">
        <tr><th>ID</th><th>Name</th><th>Designation</th><th>Actions</th></tr>
        <tr th:each="item : ${servers}">
            <td th:text="${item.id}"></td><td th:text="${item.name}"></td><td th:text="${item.designation}"></td>
            <td>
                <form th:action="@{/servers/{id}/delete(id=${item.id})}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </table>
    <br/><a href="/">Back to Home</a>
</body>
</html>
