<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Server List</title>
</head>
<body>
    <h1>Server Management</h1>
    <a th:href="@{/servers/new}">Create New Server</a><br/><br/>
    <table border="1" cellpadding="6">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Designation</th>
            <th>Actions</th>
        </tr>
        <tr th:each="item : ${servers}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.name}"></td>
            <td th:text="${item.designation}"></td>
            <td>
                <a th:href="@{/servers/{id}(id=${item.id})}">Details</a> |
                <a th:href="@{/servers/{id}/edit(id=${item.id})}">Edit</a> |
                <form th:action="@{/servers/{id}/delete(id=${item.id})}" method="post" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </table>
    <br/><a th:href="@{/}">Back to Home</a>
</body>
</html>
