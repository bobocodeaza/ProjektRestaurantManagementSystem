<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>New Server</title></head>
<body>
    <h1>Create Server</h1>
    <form th:action="@{/servers}" method="post" th:object="${server}">
        <label>Name:</label><input type="text" th:field="*{name}" required/><br/><br/><label>Designation:</label><input type="text" th:field="*{designation}" required/><br/><br/>
        <button type="submit">Save</button>
    </form>
    <br/><a th:href="@{/servers}">Cancel</a>
</body>
</html>
