<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Chef</title>
</head>
<body>
    <h1>Edit Chef</h1>
    <form th:action="@{/chefs/{id}(id=${chef.id})}" method="post" th:object="${chef}">
        <input type="hidden" th:field="*{id}"/>
        <label>Name:</label><input type="text"  th:field="*{name}" required/><br/><br/>
        <label>Specialization:</label><input type="text"  th:field="*{specialization}" required/><br/><br/>
        <button type="submit">Update</button>
    </form>
    <br/><a th:href="@{/chefs}">Cancel</a>
</body>
</html>
