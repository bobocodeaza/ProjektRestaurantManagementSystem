<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Chef List</title></head>
<body>
    <h1>Chef Management</h1>
    <a th:href="@{/chefs/new}">Create New Chef</a><br/><br/>
    <table border="1">
        <tr><th>ID</th><th>Name</th><th>Specialization</th><th>Actions</th></tr>
        <tr th:each="item : ${chefs}">
            <td th:text="${item.id}"></td><td th:text="${item.name}"></td><td th:text="${item.specialization}"></td>
            <td>
                <form th:action="@{/chefs/{id}/delete(id=${item.id})}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </table>
    <br/><a href="/">Back to Home</a>
</body>
</html>
