<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>New Chef</title></head>
<body>
    <h1>Create Chef</h1>
    <form th:action="@{/chefs}" method="post" th:object="${chef}">
        <label>Name:</label><input type="text" th:field="*{name}" required/><br/><br/><label>Specialization:</label><input type="text" th:field="*{specialization}" required/><br/><br/>
        <button type="submit">Save</button>
    </form>
    <br/><a th:href="@{/chefs}">Cancel</a>
</body>
</html>
